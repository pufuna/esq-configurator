<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Конфигуратор устройства плавного пуска ESQ F HVS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;padding:0;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;
      display:flex;flex-direction:column;align-items:center;
      background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('background2.jpg') center/cover fixed;
      position:relative
    }
    .configurator{
      width:90%;max-width:800px;margin:40px auto;padding:30px;background:rgba(255,255,255,.9);
      border-radius:15px;box-shadow:0 8px 32px rgba(0,0,0,.1);backdrop-filter:blur(5px)
    }
    .param{margin-bottom:20px;display:flex;flex-wrap:wrap;gap:15px;align-items:center;padding:15px;border-bottom:1px solid #eee}
    label{flex:1 1 250px;font-weight:500;color:#2c3e50;min-width:250px}
    select,input{flex:2 1 300px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
    .note{flex:1 1 100%;margin-top:6px;color:#666;font-size:12px}
    .note.warn{color:#b54708;font-weight:600}
    #result{
      margin:30px 0 10px;padding:20px;background:#f8f9fa;border-radius:10px;font-family:monospace;
      font-size:24px;color:#2c3e50;border:1px solid #eee;text-align:center;font-weight:bold;overflow-wrap:anywhere
    }
    #summary{margin:0 0 30px;padding:0 10px;text-align:center;color:#4a5a6e;font-size:14px;line-height:1.5}
    .result-title{font-size:1.5em;margin-bottom:15px;color:#2c3e50;font-weight:700;text-align:center}
    .home-button,.techdesc-btn,.copy-btn{
      display:inline-block;padding:12px 30px;background:#2c3e50;color:#fff;text-decoration:none;border-radius:25px;
      transition:background .3s;font-weight:600;width:100%;text-align:center;box-sizing:border-box
    }
    .home-button{margin:20px 0 10px}
    .home-button:hover{background:#34495e;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .techdesc-btn{margin:10px 0;background:#0f6b3f}
    .techdesc-btn:hover{background:#11824c;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .copy-btn{margin:10px 0;background:#1f6feb}
    .copy-btn:hover{background:#2556b8;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}

    .techdesc{
      display:none;margin-top:10px;padding:20px;background:#fff;border:1px solid #e6ecf5;border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,.06)
    }
    .techdesc h2{margin:0 0 8px;color:#1f3147}
    .meta{color:#6b7a90;margin-bottom:12px}
    table{border-collapse:collapse;width:100%;margin:12px 0}
    th,td{border:1px solid #e6ecf5;padding:8px;text-align:left;font-size:14px}
    th{background:#f3f6fb}
    .muted{color:#6b7a90}
    .sku{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f6f8fb;border:1px solid #e6ecf5;border-radius:8px;padding:10px;margin:10px 0;font-weight:700}
    .drawing-img{max-width:100%;height:auto;border:1px solid #e6ecf5;border-radius:10px;background:#fff}
    .drawing-empty{padding:10px;color:#6b7a90;background:#fafcff;border:1px dashed #d8e1f0;border-radius:10px}

    @media (max-width:768px){
      .configurator{width:95%;padding:20px;margin:20px auto}
      .param{flex-direction:column;align-items:stretch}
      label,select,input{flex:1 1 100%}
    }
    h1{color:#2c3e50;text-align:center;margin-bottom:15px;font-size:2.2em;text-shadow:0 2px 4px rgba(0,0,0,.1)}
    .title-sub{display:block;font-size:1.8em;margin-top:10px;color:#2c3e50}
    .footer{text-align:center;padding:20px;background:rgba(44,62,80,.9);color:#fff;width:100%;margin-top:auto;backdrop-filter:blur(5px)}

    /* Расшифровка маркировки */
    .decode{margin:10px 0 30px;padding:18px 20px;background:#f8f9fa;border:1px solid #eee;border-radius:10px}
    .decode h3{margin:0 0 12px;color:#2c3e50;font-size:1.1em;text-align:center}
    .dc-code{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:3px 2px;margin-bottom:16px}
    .dc-seg{display:flex;flex-direction:column;align-items:center;padding:4px 5px 2px;border-radius:6px;cursor:default;transition:background .15s}
    .dc-seg b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;color:#2c3e50;border-bottom:2px solid #c9d3df;padding:0 1px 2px;white-space:nowrap}
    .dc-seg i{font-style:normal;font-size:11px;color:#6b7a90;margin-top:3px}
    .dc-sep{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;color:#9aa6b5;padding:4px 1px 0;font-weight:700}
    .dc-seg.hl{background:#e3edff}.dc-seg.hl b{border-bottom-color:#1f6feb;color:#1f6feb}
    .dc-table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
    .dc-table th,.dc-table td{border:1px solid #e6ecf5;padding:7px 9px;text-align:left;vertical-align:top}
    .dc-table th{background:#f3f6fb;color:#2c3e50;font-weight:600}
    .dc-table td:first-child{width:28px;text-align:center;color:#6b7a90}
    .dc-table td.dc-c{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:#2c3e50;white-space:nowrap}
    .dc-table .dc-v{display:block;font-size:12px;color:#8391a5;margin-top:3px}
    .dc-table tr.hl,.dc-table tr.hl td{background:#eef4ff}
    @media (max-width:768px){
      .decode{padding:12px 8px}
      .dc-seg b,.dc-sep{font-size:15px}
      .dc-table{font-size:13px}
      .dc-table thead{display:none}
      .dc-table,.dc-table tbody{display:block}
      .dc-table tr{display:grid;grid-template-columns:24px 76px 1fr;border:1px solid #e6ecf5;border-top:none;background:#fff}
      .dc-table tr:first-child{border-top:1px solid #e6ecf5}
      .dc-table td{border:none;padding:6px 5px 2px}
      .dc-table td:first-child{width:auto}
      .dc-table td.dc-c{white-space:normal}
      .dc-table td:nth-child(3){font-weight:600;color:#2c3e50}
      .dc-table td:nth-child(4){grid-column:2 / 4;padding:0 5px 7px}
    }
    .ft-link{color:inherit;text-decoration:none;cursor:default}
    .tz-banner{margin:0 0 15px;padding:12px 15px;background:#fff7e6;border:1px solid #f5c26b;border-radius:10px;color:#2c3e50;font-size:14px}
    .tz-banner span{color:#6b7a90;font-size:13px}
    .configurator,.footer{box-sizing:border-box}
  </style>
</head>
<body>
  <div class="configurator">
    <h1>Конфигуратор устройства плавного пуска<br><span class="title-sub">ESQ F HVS</span></h1>

    <div class="param">
      <label>1. Напряжение:</label>
      <select id="voltage">
        <option value="06">6 кВ</option>
        <option value="10">10 кВ</option>
      </select>
    </div>

    <div class="param">
      <label>2. Мощность двигателя (кВт):</label>
      <select id="power"></select>
    </div>

    <div class="param">
      <label>3. Номинальный ток УПП (А):</label>
      <input type="text" id="current" readonly>
      <div class="note" id="sizeNote"></div>
    </div>

    <div class="param">
      <label>4. Комплектация:</label>
      <select id="package">
        <option value="STD">Стандартная</option>
        <option value="E">С вакуумным выключателем</option>
        <option value="S">С выкатными тиристорными блоками</option>
        <option value="IK">С вводным разъединителем</option>
      </select>
    </div>

    <div class="param">
      <label>5. Тип двигателя:</label>
      <select id="motor">
        <option value="A">Асинхронный</option>
        <option value="S">Синхронный</option>
      </select>
    </div>

    <div class="param">
      <label>6. Степень защиты:</label>
      <select id="ip">
        <option value="IP40">IP40 — стандарт</option>
        <option value="IP41">IP41 — под заказ</option>
        <option value="IP54">IP54 — под заказ</option>
      </select>
    </div>

    <div class="param">
      <label>7. Питание цепей управления:</label>
      <select id="ctl">
        <option value="AC220">~220 В AC ±15% (стандарт)</option>
        <option value="DC220">=220 В DC ±15%</option>
      </select>
    </div>

    <div class="param">
      <label>8. Вводы/выводы кабелей:</label>
      <select id="cable">
        <option value="D">Снизу</option>
        <option value="T">Сверху</option>
      </select>
    </div>

    <div class="param">
      <label>9. Вид обслуживания:</label>
      <select id="service">
        <option value="2">Двухстороннее</option>
        <option value="1">Одностороннее</option>
      </select>
    </div>

    <div class="param">
      <label>10. Протокол связи:</label>
      <select id="protocol">
        <option value="MR">Modbus RTU</option>
        <option value="MT">Modbus TCP</option>
        <option value="PB">ProfibusDP</option>
        <option value="PN">ProfiNet</option>
        <option value="CO">CanOpen</option>
        <option value="EI">Ethernet/IP</option>
      </select>
    </div>

    <div class="param">
      <label>Составил (ФИО):</label>
      <input type="text" id="tkpAuthor" placeholder="Для обложки ТКП">
    </div>
    <div class="param">
      <label>Количество, шт:</label>
      <input type="number" id="tkpQty" value="1" min="1">
    </div>
    <div class="param">
      <label>Цена за ед., руб. (с НДС 22%):</label>
      <input type="text" id="tkpPrice" placeholder="Необязательно">
    </div>

    <div class="result-title">Итог</div>
    <div id="result">ESQ F HVS</div>
    <div id="summary"></div>

    <div class="decode">
      <h3>Расшифровка маркировки</h3>
      <div class="dc-code" id="dc-code"></div>
      <table class="dc-table">
        <thead><tr><th>№</th><th>Код</th><th>Что означает</th><th>Выбрано</th></tr></thead>
        <tbody id="dc-body"></tbody>
      </table>
    </div>

    <a href="index.html" class="home-button">Вернуться на главную</a>
    <a href="#" class="techdesc-btn" onclick="toggleTechDesc(event)">Техническое описание</a>
    <a href="#" class="copy-btn" onclick="copyTechDesc(event)">Копировать описание</a>
    <a href="#" class="copy-btn" style="background:#e8631a" onclick="downloadTKP(event)">Скачать ТКП (PDF)</a>

    <div id="techdesc" class="techdesc"></div>
  </div>

  <div class="footer"><p><a href="tz.html?p=upp" class="ft-link" tabindex="-1" aria-hidden="true">©</a> 2025 ESQ</p></div>

  <script>
    /* ===== МОДЕЛИ (техническое описание ESQ F HVS, лист 13): ток УПП, А → мощность двигателя, кВт ===== */
    // модельный ряд и габариты — по техописанию ESQ F HVS (разд. 7.2)
    const MODELS = {
      '06': [[50,420],[75,630],[120,1000],[150,1250],[300,2500],[400,3300],[500,4150],[600,5000]],
      '10': [[30,420],[45,630],[60,800],[73,1000],[90,1250],[110,1500],[130,1800],[160,2250],[180,2500],[200,2800],
             [250,3500],[280,4000],[320,4500],[400,5500],[430,6000],[500,7000]]
    };
    // габаритные чертежи: ключ → габариты и картинка для сайта (в ТКП — векторные листы из assets/upp/shell.pdf)
    const DRAW = {
      STD1000: { dims: '1000×1500×2300', img: 'assets/upp/drawing_std1000.png' },
      STD1200: { dims: '1200×1700×2300', img: 'assets/upp/drawing_std1200.png' },
      E:       { dims: '1000×1500×2300', img: 'assets/upp/drawing.png' },
      IK:      { dims: '1200×1700×2300', img: 'assets/upp/drawing_ik.png' }
    };
    const MASS_KG = 800;
    const PKG = { STD:'стандартная', E:'с вакуумным выключателем', S:'с выкатными тиристорными блоками', IK:'с вводным разъединителем' };
    const CTL = { AC220:'~220 В AC ±15%', DC220:'=220 В DC ±15%' };
    const PROTO = { MR:'Modbus RTU', MT:'Modbus TCP', PB:'ProfibusDP', PN:'ProfiNet', CO:'CanOpen', EI:'Ethernet/IP' };
    function noDrawingMsg(){
      return '⚠ Габариты этой модели — по запросу (изготавливается по индивидуальному проекту): в ТКП лист эскиза и строка «Габариты» останутся пустыми. Приложите эскиз к ТКП отдельно.';
    }

    const $ = id => document.getElementById(id);
    const val = id => $(id).value;
    function esc(str){ return String(str ?? '').replace(/[&<>"]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }

    function model(){ const v = val('voltage'), I = Number(val('power')); return MODELS[v].find(m => m[0] === I); }
    // какой габаритный чертёж: стандарт и S — 1000×1500×2300 (до 300/320 А) или 1200×1700×2300 (400–500 А);
    // E — свой эскиз (есть только до 150 А при 6 кВ и до 130 А при 10 кВ); IK — свой чертёж 1200×1700×2300; 600 А — по запросу
    function drawingKey(){
      const I = Number(val('power')), v = val('voltage'), pkg = val('package');
      if (I >= 600) return null;
      if (pkg === 'E') return I <= (v === '06' ? 150 : 130) ? 'E' : null;
      if (pkg === 'IK') return 'IK';
      return I >= 400 ? 'STD1200' : 'STD1000';
    }
    function dims(){ const k = drawingKey(); return k ? DRAW[k].dims : null; }
    function noDrawing(){ return !drawingKey(); }
    // частота пусков (РЭ): 6 кВ до 2500 кВт и 10 кВ до 4000 кВт — 1–6 в час, выше — 1–3
    function startsPerHour(){ const m = model(); return m[1] > (val('voltage') === '06' ? 2500 : 4000) ? 3 : 6; }

    function buildMark(){
      const m = model(), pkg = val('package');
      return 'ESQ F HVS' + val('voltage') + '-' + String(m[0]).padStart(3,'0') + (pkg === 'STD' ? '' : '-' + pkg);
    }

    function updatePowerOptions(){
      const sel = $('power'), keep = sel.value;
      sel.innerHTML = MODELS[val('voltage')].map(([I,P]) => `<option value="${I}">${P} кВт</option>`).join('');
      if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
      update();
    }

    function summaryText(){
      const m = model(), kv = val('voltage') === '06' ? 6 : 10;
      return [kv + ' кВ', m[1] + ' кВт', m[0] + ' А', 'комплектация ' + PKG[val('package')],
        ($('motor').value === 'S' ? 'синхронный' : 'асинхронный') + ' двигатель', val('ip'),
        'питание цепей управления ' + CTL[val('ctl')], 'вводы ' + (val('cable') === 'T' ? 'сверху' : 'снизу'),
        (val('service') === '1' ? 'одностороннее' : 'двухстороннее') + ' обслуживание', PROTO[val('protocol')]].join(', ');
    }

    function update(){
      const m = model();
      $('current').value = m[0];
      $('result').textContent = buildMark();
      $('summary').textContent = summaryText();
      const n = $('sizeNote');
      if (noDrawing()) { n.textContent = noDrawingMsg(); n.className = 'note warn'; }
      else { n.textContent = 'Габариты ' + dims() + ' мм (Ш×Г×В), масса ' + MASS_KG + ' кг.'; n.className = 'note'; }
      renderDecode();
    }

    /* ===== Расшифровка маркировки ===== */
    function renderDecode(){
      const m = model(), pkg = val('package');
      const seg = [
        ['ESQ F HVS', 'Серия УПП', 'Высоковольтное устройство плавного пуска ESQ F HVS', ''],
        [val('voltage'), 'Номинальное напряжение УПП', val('voltage') === '06' ? '6 кВ' : '10 кВ', '06 — 6 кВ; 10 — 10 кВ'],
        [String(m[0]).padStart(3,'0'), 'Номинальный ток УПП', m[0] + ' А (двигатель до ' + m[1] + ' кВт)', 'три цифры тока'],
      ];
      if (pkg !== 'STD') seg.push([pkg, 'Комплектация', PKG[pkg], 'без букв — стандартная; E — с вакуумным выключателем; S — с выкатными тиристорными блоками; IK — с вводным разъединителем']);
      const sep = {0:'', 1:'-', 2: pkg !== 'STD' ? '-' : ''};
      $('dc-code').innerHTML = seg.map((s, i) => `<span class="dc-seg" data-i="${i}"><b>${esc(s[0])}</b><i>${i + 1}</i></span>` + (sep[i] ? '<span class="dc-sep">-</span>' : '')).join('');
      $('dc-body').innerHTML = seg.map((s, i) =>
        `<tr data-i="${i}"><td>${i + 1}</td><td class="dc-c">${esc(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[2])}${s[3] ? `<span class="dc-v">${esc(s[3])}</span>` : ''}</td></tr>`).join('');
    }
    ['dc-code','dc-body'].forEach(id => {
      const box = $(id);
      box.addEventListener('mouseover', e => { const el = e.target.closest('[data-i]'); if (el) dcHighlight(el.dataset.i); });
      box.addEventListener('mouseleave', () => dcHighlight(null));
    });
    function dcHighlight(i){ document.querySelectorAll('.dc-seg, #dc-body tr').forEach(el => el.classList.toggle('hl', el.dataset.i === i)); }

    window.isDrawingMissing = noDrawing;   // для страницы разбора ТЗ
    window.UPP_MODELS = MODELS;            // модельный ряд — для таблицы в ТКП

    /* ===== Состояние для ТКП (tkp_upp.js) ===== */
    window.uppState = function(){
      const m = model(), mark = buildMark(), kv = val('voltage') === '06' ? 6 : 10;
      return {
        mark, kv, I: m[0], P: m[1], pkg: val('package'), motor: val('motor'), ip: val('ip'), ctl: val('ctl'),
        cable: val('cable'), srv: val('service'), proto: val('protocol'), noDrawing: noDrawing(), dims: dims(), drawing: drawingKey(), startsH: startsPerHour(), massKg: MASS_KG,
        who: val('tkpAuthor').trim(), qty: Math.max(1, parseInt(val('tkpQty'), 10) || 1),
        price: parseFloat(String(val('tkpPrice')).replace(/\s/g, '').replace(',', '.')) || 0,
        name: 'Устройство плавного пуска ' + mark + ', ' + kv + ' кВ, ' + m[1] + ' кВт, ' + m[0] + ' А' +
          (val('package') === 'STD' ? '' : ', ' + PKG[val('package')])
      };
    };

    /* ===== ТЕХОПИСАНИЕ ===== */
    function buildTechDescriptionHtml(){
      const m = model(), kv = val('voltage') === '06' ? 6 : 10;
      const rows = (list) => list.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
      return `
        <h2>Техническое описание конфигурации</h2>
        <div class="meta">Дата формирования: ${esc(new Date().toLocaleString())}</div>
        <div class="sku">${esc(buildMark())}</div>
        <p class="muted">Высоковольтное устройство плавного пуска ESQ F HVS предназначено для плавного безударного пуска и останова
          высоковольтных асинхронных и синхронных электродвигателей там, где не требуется регулирование скорости:
          насосы, вентиляторы, компрессоры, дробилки, мешалки, конвейеры. Снижает пусковые токи и провалы напряжения сети,
          после разгона двигатель переводится на сеть встроенным вакуумным байпасным контактором.</p>

        <h3>Выбранные параметры</h3>
        <table>
          <tr><th>Параметр</th><th>Значение</th></tr>
          ${rows([
            ['Напряжение питающей сети', (kv === 6 ? '6000' : '10000') + ' В ±15%'],
            ['Мощность подключаемого двигателя', m[1] + ' кВт'],
            ['Номинальный ток УПП', m[0] + ' А'],
            ['Комплектация', PKG[val('package')]],
            ['Тип двигателя', val('motor') === 'S' ? 'Синхронный' : 'Асинхронный с короткозамкнутым ротором'],
            ['Степень защиты', val('ip')],
            ['Питание цепей управления', CTL[val('ctl')]],
            ['Ввод и вывод кабелей', val('cable') === 'T' ? 'Сверху' : 'Снизу'],
            ['Вид обслуживания', val('service') === '1' ? 'Одностороннее' : 'Двухстороннее'],
            ['Протокол связи', val('protocol') === 'MR' ? 'Modbus RTU (RS-485)' : 'Modbus RTU (RS-485); ' + PROTO[val('protocol')]],
          ])}
        </table>

        <h3>Технические характеристики (постоянные)</h3>
        <table>
          <tr><th>Параметр</th><th>Значение</th></tr>
          ${rows([
            ['Частота питающей сети', '50/60 Гц ±2 Гц'],
            ['Последовательность фаз', 'любая (контроль чередования включается параметром)'],
            ['Силовая цепь', '12, 18, 24 или 30 тиристоров (в зависимости от модели и напряжения), оптоволоконное управление'],
            ['Байпасный контактор', 'встроенный вакуумный, с возможностью прямого пуска'],
            ['Пусковой ток', '1,5–5,0 Iе (уставка ограничения тока 100–500% Iе)'],
            ['Частота пусков', '1–6 пусков в час с интервалом не менее 10 мин (в зависимости от мощности и условий пуска)'],
            ['Режимы пуска', 'линейное или ускоренное изменение напряжения; ограничение тока; пуск со скачком напряжения (20–100% Uе, 0–5 с); пуск с постоянным напряжением (30–80% Uе, 0–30 с)'],
            ['Режимы останова', 'выбег; плавный останов (0–60 с до 20–60% Uе)'],
            ['Защиты', 'обрыв фазы; перегрузка по току в работе 100–500% Iе (0–10 с); небаланс тока фаз 20–100% (0–10 с); тепловая перегрузка, классы 10A/10/20/30 или выкл.; недогрузка 50–100% Iе (0–10 с); заклинивание ротора 5–10 Iе; затянутый пуск 10–120 с; повышенное (120% Uе) и пониженное (70% Uе) напряжение; чередование фаз; замыкание на землю; защита тиристоров'],
            ['Входы', 'пуск, стоп, внешняя авария, готовность, пуск/стоп от АСУ ТП'],
            ['Выходы', 'реле: авария, байпас, программируемое; сигналы готовности, работы, останова; аналоговый 4–20 мА (средний ток, 0–2 Iе или 0–4 Iе)'],
            ['Управление', 'местное (панель), дистанционное (сухие контакты), от АСУ ТП, по интерфейсу связи; до 32 устройств в линии RS-485'],
            ['Панель управления', 'сенсорный ЖК-дисплей; языки: русский, английский'],
            ['Журнал', 'последние 1000 аварийных сообщений; счётчики пусков и наработки'],
            ['Охлаждение', 'естественное воздушное'],
            ['Тепловыделение', 'при пуске 0,8–1% мощности УПП, после пуска (байпас) 300–500 Вт'],
            ['Условия эксплуатации', 'в помещении, −20…+50 °С, влажность 5–95% без конденсата, высота до 1500 м (выше — со снижением характеристик)'],
          ])}
        </table>

        <h3>Габариты и масса</h3>
        <table>
          <tr><th>Параметр</th><th>Значение</th></tr>
          ${rows((dims() ? [['Габариты (Ш×Г×В), мм', dims()]] : []).concat([['Масса', MASS_KG + ' кг']]))}
        </table>
        ${noDrawing()
          ? '<div class="drawing-empty">' + noDrawingMsg() + '</div>'
          : '<h3>Габаритный эскиз</h3><img class="drawing-img" src="' + DRAW[drawingKey()].img + '" alt="Габаритный эскиз ESQ F HVS">'}
      `;
    }

    function toggleTechDesc(e){
      e.preventDefault();
      const box = $('techdesc');
      box.innerHTML = buildTechDescriptionHtml();
      box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'block' : 'none';
      if (box.style.display === 'block') box.scrollIntoView({behavior:'smooth', block:'start'});
    }

    async function copyTechDesc(e){
      e.preventDefault();
      const box = $('techdesc');
      const src = (box && box.style.display !== 'none' && box.innerText.trim())
        ? box : (() => { const t=document.createElement('div'); t.style.position='fixed'; t.style.left='-99999px'; t.innerHTML=buildTechDescriptionHtml(); document.body.appendChild(t); return t; })();
      const text = src.innerText.replace(/\n{3,}/g, '\n\n').trim();
      try{ await navigator.clipboard.writeText(text); alert('Описание скопировано в буфер обмена.'); }
      catch(err){
        const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Описание скопировано (fallback).');
      }
      if (src !== box) document.body.removeChild(src);
    }

    /* ===== Конфигурация из разбора ТЗ (параметры в адресе страницы) =====
       ?from=tz&v=06&kw=630&a=75&pkg=STD&mot=A&ip=IP41&ctl=AC220&cab=D&srv=2&pr=MR&qty=2&tz=...
       Подбирается наименьшая модель, у которой мощность ≥ kw и ток ≥ a. */
    function applyUrlParams(){
      let q; try { q = new URLSearchParams(location.search); } catch(e){ return; }
      if (q.get('from') !== 'tz') return;
      const set = (id, v) => { const el = $(id); if (!el || v == null || v === '') return false;
        if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === v)) return false; el.value = v; return true; };
      const notes = [];
      if (set('voltage', q.get('v'))) updatePowerOptions();
      const kw = Number(q.get('kw')) || 0, a = Number(q.get('a')) || 0;
      const fit = MODELS[val('voltage')].find(([I, P]) => P >= kw && I >= a);
      if (fit) set('power', String(fit[0]));
      else if (kw || a) notes.push('нет модели под ' + (kw ? kw + ' кВт' : '') + (a ? ' / ' + a + ' А' : '') + ' — выбрана вручную');
      [['pkg','package'],['mot','motor'],['ip','ip'],['ctl','ctl'],['cab','cable'],['srv','service'],['pr','protocol']].forEach(([k, id]) => {
        if (q.get(k) && !set(id, q.get(k))) notes.push(k + '=' + q.get(k) + ' недоступно');
      });
      if (q.get('qty')) $('tkpQty').value = q.get('qty');
      update();
      const box = document.createElement('div');
      box.className = 'tz-banner';
      box.innerHTML = '<b>Конфигурация из разбора ТЗ</b>' + (q.get('tz') ? ': ' + esc(q.get('tz')) : '') +
        '<br><span>Проверьте параметры перед скачиванием ТКП.' + (notes.length ? ' Внимание: ' + esc(notes.join('; ')) + '.' : '') + '</span>';
      const host = document.querySelector('.configurator');
      host.insertBefore(box, host.querySelector('.param'));
    }

    document.addEventListener('DOMContentLoaded', () => {
      updatePowerOptions();
      $('power').value = '75'; update();          // по умолчанию — модель образца ТКП
      applyUrlParams();
      document.querySelectorAll('select').forEach(el => el.addEventListener('change', el.id === 'voltage' ? updatePowerOptions : update));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="tkp_upp.js"></script>
