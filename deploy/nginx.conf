# Конфигураторы ESQ на nginx — фрагмент для блока server { } портала.
# Архив распакован в /var/www/configurator → сайт открывается по адресу https://<портал>/configurator/
# (другое имя папки — поменяйте и путь в location, и папку на диске).
location /configurator/ {
    root /var/www;
    index index.html;
    # сжатие страниц, скриптов и данных (gzip): в 3–5 раз меньше трафика; PDF, картинки и шрифты уже сжаты
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    # страницы, скрипты и данные — браузер сверяет их с сервером, чтобы после обновления никто не работал со старой версией
    add_header Cache-Control "no-cache";

    location ~* \.(pdf|png|jpg|webp|woff2?)$ { add_header Cache-Control "max-age=604800"; }   # чертежи, картинки, шрифты — кэш на неделю
}

# В mime.types старых версий nginx нет этих типов — добавьте в http { } или в файл mime.types:
#   types { text/javascript mjs; image/webp webp; font/woff2 woff2; }
# (если типы добавляются в http { } через types { }, они заменяют весь mime.types — тогда допишите их в сам файл mime.types)
